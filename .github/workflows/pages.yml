name: deploy-pages
# Se ejecuta en la rama por defecto (main) para cumplir la regla del entorno github-pages,
# y publica el contenido de la rama gh-pages (que el publicador del box actualiza).
on:
  repository_dispatch:
    types: [panel-data]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d
        uses: actions/deploy-pages@v4
